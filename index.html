<script>
  // Apply theme before first paint to avoid a light flash in dark mode
  try {
    var p = JSON.parse(localStorage.getItem("md.local:prefs") || "{}") || {};
    var t = p.theme || "auto";
    if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    if (p.sidebar === false) document.documentElement.classList.add("sidebar-collapsed");
    if (p.sidebarWidth) document.documentElement.style.setProperty("--sidebar-w", p.sidebarWidth + "px");
  } catch (e) {}
</script>

<header class="bar">
  <button id="btn-sidebar" class="icon-btn" data-i18n-title="sidebar.toggle" data-i18n-aria="sidebar.toggleAria"
    title="Show/hide document list (Ctrl+\)" aria-label="Show/hide document list">
    <svg class="i"><use href="#i-menu"/></svg>
  </button>
  <a class="brand" href="https://hotromd.github.io/" data-i18n-title="brand.title" title="MD Helper - a product of Hỗ Trợ Giải Pháp Số">
    <img src="favicon.svg" alt="" width="22" height="22"><span><b>MD</b> Helper</span>
  </a>

  <div class="seg" role="tablist" data-i18n-aria="mode.aria" aria-label="Display mode">
    <button id="tab-edit" role="tab" aria-selected="false" data-i18n-title="mode.editTitle" title="Edit (Alt+1)"><svg class="i"><use href="#i-edit"/></svg><span class="lbl" data-i18n="mode.edit">Edit</span></button>
    <button id="tab-split" role="tab" aria-selected="false" data-i18n-title="mode.splitTitle" title="Split view (Alt+2)"><svg class="i"><use href="#i-columns"/></svg><span class="lbl" data-i18n="mode.split">Split</span></button>
    <button id="tab-view" role="tab" aria-selected="false" data-i18n-title="mode.viewTitle" title="Preview (Alt+3)"><svg class="i"><use href="#i-eye"/></svg><span class="lbl" data-i18n="mode.view">Preview</span></button>
  </div>

  <div id="gsearch" class="gsearch">
    <svg class="i"><use href="#i-search"/></svg>
    <input id="gs-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false"
      aria-controls="gs-panel" autocomplete="off" spellcheck="false"
      data-i18n-placeholder="gs.placeholder" data-i18n-aria="gs.aria"
      placeholder="Search all documents…" aria-label="Search all documents">
    <kbd class="gs-kbd" data-i18n-title="gs.kbdTitle" title="Shortcut: / or Ctrl+Shift+F">/</kbd>
    <div id="gs-panel" class="gs-panel" role="listbox" data-i18n-aria="gs.results" aria-label="Search results" hidden></div>
  </div>

  <div class="actions">
    <button id="btn-open" class="btn" data-i18n-title="open.title" title="Open .md files (Ctrl+O), or drop them onto the window">
      <svg class="i"><use href="#i-upload"/></svg><span class="lbl" data-i18n="open.label">Open</span>
    </button>
    <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>

    <div class="menu-wrap">
      <button id="btn-export" class="btn btn-primary" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-export">
        <svg class="i"><use href="#i-download"/></svg><span class="lbl" data-i18n="export.label">Export</span><svg class="i i-sm"><use href="#i-chevron"/></svg>
      </button>
      <div id="menu-export" class="menu" role="menu" hidden>
        <button role="menuitem" data-action="export-md">Markdown <small>.md</small></button>
        <button role="menuitem" data-action="export-html"><span data-i18n="export.html">Web page</span> <small>.html</small></button>
        <button role="menuitem" data-action="export-doc">Word <small>.doc</small></button>
        <button role="menuitem" data-action="export-pdf">PDF <small>Ctrl+P</small></button>
        <div class="menu-sep" role="separator"></div>
        <button role="menuitem" data-action="copy-rich"><span data-i18n="export.copyRich">Copy with formatting</span> <small data-i18n="export.copyRichHint">paste into Word, email…</small></button>
        <button role="menuitem" data-action="copy-md"><span data-i18n="export.copyMd">Copy Markdown</span></button>
      </div>
    </div>

    <button id="btn-lang" class="icon-btn lang-btn" data-i18n-title="lang.switch" data-i18n-aria="lang.switch"
      title="Language: English. Click to switch to Tiếng Việt" aria-label="Language: English. Click to switch to Tiếng Việt">EN</button>
    <button id="btn-theme" class="icon-btn" data-i18n-aria="theme.aria" aria-label="Switch light/dark theme">
      <svg class="i"><use id="theme-icon" href="#i-monitor"/></svg>
    </button>
    <button id="btn-help" class="icon-btn" data-i18n-title="help.title" data-i18n-aria="help.aria"
      title="Shortcuts & tips (Ctrl+/)" aria-label="Shortcuts & tips">
      <svg class="i"><use href="#i-help"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar" data-i18n-aria="sidebar.aria" aria-label="Documents">
    <div class="sidebar-top">
      <div class="new-row">
        <button id="btn-new" class="btn btn-primary btn-block" data-i18n-title="new.title" title="New document (Alt+N)">
          <svg class="i"><use href="#i-plus"/></svg><span data-i18n="new.label">New document</span>
        </button>
        <button id="btn-new-folder" class="btn" data-i18n-title="newFolder" data-i18n-aria="newFolder" title="New folder" aria-label="New folder">
          <svg class="i"><use href="#i-folder-plus"/></svg>
        </button>
      </div>
      <div class="search">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="search" type="search" data-i18n-placeholder="filter.placeholder" data-i18n-aria="filter.aria"
          placeholder="Filter list…" aria-label="Filter document list">
      </div>
    </div>
    <ul id="doc-list" class="doc-list"></ul>
    <p id="doc-empty" class="doc-empty" data-i18n="docEmpty" hidden>No matching documents</p>
    <div class="sidebar-foot">
      <span id="doc-count"></span>
      <div class="menu-wrap">
        <button id="btn-more" class="icon-btn" data-i18n-title="more" data-i18n-aria="more" title="Back up / restore" aria-label="Back up / restore"
          aria-haspopup="menu" aria-expanded="false" aria-controls="menu-more">
          <svg class="i"><use href="#i-dots"/></svg>
        </button>
        <div id="menu-more" class="menu menu-up" role="menu" hidden>
          <button role="menuitem" data-action="backup"><span data-i18n="backup">Back up all documents</span> <small>.json</small></button>
          <button role="menuitem" data-action="restore"><span data-i18n="restore">Restore from backup…</span></button>
        </div>
      </div>
      <input id="backup-input" type="file" accept=".json,application/json" hidden>
    </div>
  </aside>
  <div id="sidebar-handle" class="sidebar-handle" role="separator" aria-orientation="vertical" aria-controls="sidebar" tabindex="0"
    data-i18n-aria="sbHandle.aria" data-i18n-title="handle.title"
    aria-label="Resize document list" title="Drag to resize, double-click to reset"></div>
  <div id="scrim" class="scrim"></div>

  <div class="workspace">
    <div class="doc-head">
      <button id="doc-folder" class="folder-chip" data-i18n-title="folderChip.title" title="Move this document to another folder" aria-haspopup="menu" aria-expanded="false">
        <svg class="i"><use href="#i-folder"/></svg><span id="doc-folder-name"></span><svg class="i i-sm"><use href="#i-chevron"/></svg>
      </button>
      <label for="title-input" class="sr-only" data-i18n="title.label">Title</label>
      <input id="title-input" class="title-input" type="text" data-i18n-placeholder="title.placeholder" placeholder="Title (taken from the first heading automatically)">
      <button id="btn-auto-title" class="btn btn-ghost btn-small" data-i18n-title="autoTitle.title" title="Use the automatic title from the content">
        <svg class="i"><use href="#i-wand"/></svg><span class="lbl" data-i18n="autoTitle.label">Auto</span>
      </button>
      <button id="btn-outline" class="btn btn-ghost btn-small" aria-pressed="false" data-i18n-title="outline.toggle" title="Show/hide outline">
        <svg class="i"><use href="#i-toc"/></svg><span class="lbl" data-i18n="outline.label">Outline</span>
      </button>
    </div>

    <div id="toolbar" class="toolbar" role="toolbar" data-i18n-aria="toolbar.aria" aria-label="Formatting">
      <button data-cmd="heading" data-i18n-title="tb.heading" title="Heading H1 → H2 → H3 (press repeatedly)"><b>H</b></button>
      <button data-cmd="bold" data-i18n-title="tb.bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" data-i18n-title="tb.italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button data-cmd="strike" data-i18n-title="tb.strike" title="Strikethrough"><s>S</s></button>
      <span class="tb-sep"></span>
      <button data-cmd="code" data-i18n-title="tb.code" title="Inline code (Ctrl+E)"><svg class="i"><use href="#i-code"/></svg></button>
      <button data-cmd="codeblock" data-i18n-title="tb.codeblock" title="Code block"><svg class="i"><use href="#i-codeblock"/></svg></button>
      <button data-cmd="link" data-i18n-title="tb.link" title="Link (Ctrl+K)"><svg class="i"><use href="#i-link"/></svg></button>
      <button data-cmd="image" data-i18n-title="tb.image" title="Image"><svg class="i"><use href="#i-image"/></svg></button>
      <span class="tb-sep"></span>
      <button data-cmd="quote" data-i18n-title="tb.quote" title="Quote"><svg class="i"><use href="#i-quote"/></svg></button>
      <button data-cmd="ul" data-i18n-title="tb.ul" title="Bulleted list"><svg class="i"><use href="#i-ul"/></svg></button>
      <button data-cmd="ol" data-i18n-title="tb.ol" title="Numbered list"><svg class="i"><use href="#i-ol"/></svg></button>
      <button data-cmd="task" data-i18n-title="tb.task" title="Task list"><svg class="i"><use href="#i-task"/></svg></button>
      <button data-cmd="table" data-i18n-title="tb.table" title="Insert table"><svg class="i"><use href="#i-table"/></svg></button>
      <button data-cmd="hr" data-i18n-title="tb.hr" title="Horizontal rule"><svg class="i"><use href="#i-hr"/></svg></button>
      <span class="tb-spacer"></span>
      <button id="btn-sync" class="tb-toggle" aria-pressed="true" data-i18n-title="sync.title" title="Sync scrolling between editor and preview">
        <svg class="i"><use href="#i-sync"/></svg><span class="lbl" data-i18n="sync.label">Sync scroll</span>
      </button>
    </div>

    <div class="content">
      <main id="app" data-mode="split">
        <section class="pane pane-edit">
          <label for="editor" class="sr-only" data-i18n="editor.label">Markdown content</label>
          <textarea id="editor" spellcheck="false" data-i18n-placeholder="editor.placeholder"
            placeholder="Paste or type Markdown here… (drop .md files onto the window to open them)"></textarea>
        </section>
        <div id="split-handle" class="split-handle" role="separator" aria-orientation="vertical" tabindex="0"
          data-i18n-aria="split.aria" data-i18n-title="handle.title"
          aria-label="Resize panes" title="Drag to resize, double-click to reset"></div>
        <section id="pane-view" class="pane pane-view">
          <article id="preview" class="markdown-body" data-i18n-empty="preview.empty"
            data-empty="Nothing here yet. Type Markdown in the editor to preview it here."></article>
        </section>
      </main>
      <nav id="outline" class="outline" data-i18n-aria="outline.label" aria-label="Outline" hidden>
        <div class="outline-head">
          <span data-i18n="outline.label">Outline</span>
          <button id="btn-outline-close" class="icon-btn icon-btn-sm" data-i18n-aria="outline.close" aria-label="Close outline"><svg class="i"><use href="#i-x"/></svg></button>
        </div>
        <ul id="outline-list" class="outline-list"></ul>
        <p id="outline-empty" class="outline-empty" data-i18n="outline.empty">This document has no headings yet (#, ##, ###…)</p>
      </nav>
    </div>

    <footer class="statusbar">
      <span id="stat-words"></span>
      <span id="stat-chars"></span>
      <span id="stat-read"></span>
      <span id="stat-cursor"></span>
      <span class="sb-spacer"></span>
      <span id="save-state" aria-live="polite"></span>
      <span class="zoom" role="group" data-i18n-aria="zoom.aria" aria-label="Font size">
        <button id="font-dec" data-i18n-title="zoom.dec" data-i18n-aria="zoom.dec" title="Smaller text" aria-label="Smaller text">A−</button>
        <span id="font-size">100%</span>
        <button id="font-inc" data-i18n-title="zoom.inc" data-i18n-aria="zoom.inc" title="Larger text" aria-label="Larger text">A+</button>
      </span>
      <a class="sb-maker" href="https://hotroso.github.io/" target="_blank" rel="noopener" title="Hỗ Trợ Giải Pháp Số" data-i18n="maker">A product of Hỗ Trợ Giải Pháp Số</a>
    </footer>
  </div>
</div>

<div id="drop-overlay" class="drop-overlay" hidden>
  <div class="drop-box"><svg class="i"><use href="#i-upload"/></svg><span data-i18n="drop">Drop Markdown files here to open them</span></div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="help" class="dialog" aria-labelledby="help-title">
  <div class="dialog-head">
    <h2 id="help-title" data-i18n="help.heading">Shortcuts &amp; tips</h2>
    <form method="dialog"><button class="icon-btn" data-i18n-aria="close" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></form>
  </div>
  <div class="dialog-body" data-i18n-html="help.body"></div>
</dialog>

<script src="i18n.js"></script>
<script src="lib/marked.min.js"></script>
<!-- Syntax highlight from CDN; the app still works (without colors) if it fails to load.
     Mermaid is loaded on demand by app.js only when a document contains a ```mermaid block. -->
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
